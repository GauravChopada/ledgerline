# Base config for preview apps; the workflow overrides the app name per pull request.
app = "ledgerline-preview"
primary_region = "bom"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/data"
