name: Preview

# Every pull request gets its own short-lived app so reviewers can click through the change.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app="ledgerline-pr-${{ github.event.pull_request.number }}"
          flyctl apps create "$app" --org ledgerline || true
          flyctl deploy --app "$app" --remote-only --ha=false

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://ledgerline-pr-${context.issue.number}.fly.dev`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `Preview deployed: ${url}` });
